# ----------------------------------------------------------------------------
# Pipeline CI/CD — GitHub Actions (R4)
#
# Dedicado a MLOps: lint (ruff), SAST informacional (bandit), testes (pytest) e
# build da imagem Docker de inferência. NÃO há deploy AWS aqui — o `sam deploy`
# é manual e documentado no README (ver design.md "Relação com o CI/CD").
#
# Estrutura encadeada (R4.6):  lint ─┐
#                                     ├─► build (needs: [lint, test])
#                              test ─┘
#   security (bandit) roda em paralelo, informacional e NÃO bloqueia (R4.1).
#
# Mínimo de 2 automações bloqueantes exigidas (R4.1): lint + test. Se qualquer
# uma falhar, o pipeline falha e o build não roda, bloqueando o merge (R4.4).
# ----------------------------------------------------------------------------
name: CI

on:
  push:
  pull_request:

# Cancela execuções antigas do mesmo ref quando um novo push chega.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  # --------------------------------------------------------------------------
  # lint — ruff sobre src/ e tests/ (BLOQUEANTE, R4.2)
  # --------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: ruff check (src/ e tests/)
        run: ruff check src tests

  # --------------------------------------------------------------------------
  # security — bandit (SAST INFORMACIONAL, não bloqueia, R4.1 / design.md)
  # --------------------------------------------------------------------------
  security:
    name: Security (bandit)
    runs-on: ubuntu-latest
    # Reporta findings mas nunca falha o pipeline (modo informacional).
    continue-on-error: true
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: bandit -r src/ (informacional)
        # A config (exclude_dirs/skips) vem do pyproject.toml via `-c`.
        run: bandit -c pyproject.toml -r src

  # --------------------------------------------------------------------------
  # test — pytest de API e inferência (BLOQUEANTE, R4.3)
  # --------------------------------------------------------------------------
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Treinar modelo (gera models/model.pkl para os testes da API)
        # Os testes de API carregam models/model.pkl no lifespan. O artefato é
        # gitignored, então o treino o produz aqui; sem data/laudos.csv o treino
        # gera o dataset sintético automaticamente (fallback CI/offline).
        run: python -m src.model.train

      - name: pytest
        run: pytest

  # --------------------------------------------------------------------------
  # build — docker build da imagem de inferência (R4.5)
  # Só roda após lint E test passarem (R4.4/R4.6). security NÃO é pré-requisito.
  # --------------------------------------------------------------------------
  build:
    name: Build (docker)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Treinar modelo (gera models/model.pkl para o contexto de build)
        # O Dockerfile faz `COPY models/`; o .dockerignore inclui models/*.pkl no
        # contexto. O artefato é gitignored, então o treino o produz antes do build.
        run: python -m src.model.train

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: docker build (sem push — CI dedicado a MLOps, sem registry/AWS)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: triagem-laudos-medicos:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --------------------------------------------------------------------------
  # deploy — AWS SAM deploy (SOMENTE em push na main).
  #
  # Autentica na AWS via GitHub OIDC (sem chaves de longa duração): assume a
  # role cujo ARN está no secret AWS_DEPLOY_ROLE_ARN. Requer `id-token: write`.
  # Só roda após lint, test e build passarem; o build já validou a imagem.
  # Usa o config-env `ci` do samconfig.toml (não-interativo, resolve ECR/S3).
  #
  # Pré-requisitos (configurados UMA vez, fora deste repo):
  #   - Provider OIDC do GitHub na conta AWS.
  #   - IAM Role com trust para o repo/branch e permissões de deploy do SAM
  #     (CloudFormation, Lambda, ECR, S3, API Gateway, IAM PassRole).
  #   - Secret do repositório: AWS_DEPLOY_ROLE_ARN.
  # --------------------------------------------------------------------------
  deploy:
    name: Deploy (sam)
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      id-token: write      # necessário para o OIDC emitir o token
      contents: read
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configurar credenciais AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: sam build
        run: sam build --config-env ci

      - name: sam deploy (não-interativo)
        run: sam deploy --config-env ci --no-confirm-changeset --no-fail-on-empty-changeset

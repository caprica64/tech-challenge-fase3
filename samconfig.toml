# ---------------------------------------------------------------------------
# Configuração de deploy do AWS SAM — parâmetros por ambiente (R10.8).
#
# Este arquivo guarda APENAS valores de configuração de deploy e os
# `parameter_overrides` do template.yaml por ambiente. NÃO contém segredos nem
# credenciais AWS — estas são resolvidas pelo ambiente do operador (perfil da
# AWS CLI / SSO), nunca commitadas no repositório.
#
# Os valores abaixo são placeholders VÁLIDOS e devem ser sobrescritos pelo
# operador (edite diretamente ou use `sam deploy --guided`). Em especial,
# `ModelBucketName` precisa ser globalmente único no S3 — troque o sufixo.
#
# Uso:
#   sam build
#   sam deploy                       # usa [default] (ambiente dev)
#   sam deploy --config-env prod     # usa [prod]
# ---------------------------------------------------------------------------
version = 0.1

# Ambiente padrão (dev).
[default.global.parameters]
stack_name = "triagem-laudos-dev"

[default.build.parameters]
cached = true
parallel = true

[default.deploy.parameters]
region = "us-east-1"
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
image_repositories = ["TriageFunction=861211186414.dkr.ecr.us-east-1.amazonaws.com/triagemlaudosdev5e9a4824/triagefunctioncc023aa1repo"]
parameter_overrides = "ModelBucketName=\"triagem-laudos-model-dev-caprica\" ModelKey=\"model.onnx\" ModelFormat=\"onnx\" Stage=\"dev\" MemorySize=\"3008\" Timeout=\"30\""
s3_bucket = "aws-sam-cli-managed-default-samclisourcebucket-abwwmtbtk1rl"
s3_prefix = "triagem-laudos-dev"

[default.delete.parameters]
region = "us-east-1"

# Ambiente de produção (prod).
[prod.global.parameters]
stack_name = "triagem-laudos-prod"

[prod.build.parameters]
cached = true
parallel = true

[prod.deploy.parameters]
region = "us-east-1"
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_image_repos = true
parameter_overrides = "ModelBucketName=\"triagem-laudos-model-prod-change-me\" ModelKey=\"model.onnx\" ModelFormat=\"onnx\" Stage=\"prod\" MemorySize=\"2048\" Timeout=\"30\""

[prod.delete.parameters]
region = "us-east-1"

# ---------------------------------------------------------------------------
# Ambiente de CI/CD (GitHub Actions) — deploy não-interativo via OIDC.
#
# Diferenças em relação a [default]:
#   - resolve_image_repos = true  -> o SAM cria/gerencia o repositório ECR na
#     conta assumida pela role OIDC (sem ARN específico de conta no repo).
#   - resolve_s3 = true           -> o SAM cria/usa o bucket de origem gerenciado
#     automaticamente (sem bucket hardcoded, funciona em conta limpa).
#   - confirm_changeset = false   -> sem prompt interativo no runner.
#   - fail_on_empty_changeset = false -> um push sem mudanças de infra não falha.
#
# ModelBucketName precisa ser globalmente único; ajuste o sufixo conforme a
# conta de destino, ou mantenha alinhado ao bucket já existente no ambiente.
# Credenciais vêm da role OIDC do workflow, nunca commitadas.
# ---------------------------------------------------------------------------
[ci.global.parameters]
stack_name = "triagem-laudos-dev"

[ci.build.parameters]
cached = true
parallel = true

[ci.deploy.parameters]
region = "us-east-1"
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
fail_on_empty_changeset = false
resolve_image_repos = true
resolve_s3 = true
parameter_overrides = "ModelBucketName=\"triagem-laudos-model-dev-caprica\" ModelKey=\"model.onnx\" ModelFormat=\"onnx\" Stage=\"dev\" MemorySize=\"3008\" Timeout=\"30\""

[ci.delete.parameters]
region = "us-east-1"
